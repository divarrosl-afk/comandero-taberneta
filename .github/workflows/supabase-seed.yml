name: Supabase seed

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: Contraseña para divarro (si no existe el secreto SEED_ADMIN_PASSWORD)
        required: false
        type: string
      camarero_password:
        description: Contraseña para david/ingrid/cocina (si no existe SEED_CAMARERO_PASSWORD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Crear usuarios Auth + perfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Seed usuarios
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RESTAURANTE_ID: ${{ secrets.NEXT_PUBLIC_RESTAURANTE_ID }}
          SEED_ADMIN_PASSWORD: ${{ github.event.inputs.admin_password || secrets.SEED_ADMIN_PASSWORD }}
          SEED_CAMARERO_PASSWORD: ${{ github.event.inputs.camarero_password || secrets.SEED_CAMARERO_PASSWORD }}
        run: |
          if [ -z "$SEED_ADMIN_PASSWORD" ] || [ -z "$SEED_CAMARERO_PASSWORD" ]; then
            echo "✗ Faltan contraseñas."
            echo "  Opción A: GitHub → Settings → Secrets → SEED_ADMIN_PASSWORD y SEED_CAMARERO_PASSWORD"
            echo "  Opción B: Run workflow → rellena admin_password y camarero_password"
            exit 1
          fi
          node scripts/ci/validate-secrets.mjs seed
          node scripts/seed-supabase.mjs
