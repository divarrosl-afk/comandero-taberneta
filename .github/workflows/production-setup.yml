name: Production setup

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-setup
  cancel-in-progress: false

jobs:
  supabase-migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: "1 · Supabase migrate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ci/validate-secrets.mjs migrate
      - name: Bootstrap Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/bootstrap-supabase-db.mjs

  supabase-seed:
    name: "1b · Seed usuarios Supabase"
    needs: supabase-migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Seed usuarios (directo a Supabase)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RESTAURANTE_ID: ${{ secrets.NEXT_PUBLIC_RESTAURANTE_ID }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_CAMARERO_PASSWORD: ${{ secrets.SEED_CAMARERO_PASSWORD }}
        run: |
          if [ -z "$SEED_ADMIN_PASSWORD" ] || [ -z "$SEED_CAMARERO_PASSWORD" ]; then
            echo "⏭ Sin secretos SEED_* — ejecuta workflow «Supabase seed» con contraseñas"
            exit 0
          fi
          node scripts/ci/validate-secrets.mjs seed
          node scripts/seed-supabase.mjs

  vercel-configure:
    name: "2 · Vercel configure"
    needs: supabase-migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RESTAURANTE_ID: ${{ secrets.NEXT_PUBLIC_RESTAURANTE_ID }}
        run: node scripts/ci/validate-secrets.mjs vercel-env
      - name: Configure Vercel env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_SLUG: divarro
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RESTAURANTE_ID: ${{ secrets.NEXT_PUBLIC_RESTAURANTE_ID }}
          SETUP_BOOTSTRAP_TOKEN: ${{ secrets.SETUP_BOOTSTRAP_TOKEN }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_CAMARERO_PASSWORD: ${{ secrets.SEED_CAMARERO_PASSWORD }}
        run: node scripts/ci/configure-vercel-env.mjs

  vercel-redeploy:
    name: "3 · Vercel redeploy"
    needs: vercel-configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/validate-secrets.mjs vercel-redeploy
      - name: Redeploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_SLUG: divarro
        run: node scripts/ci/redeploy-vercel.mjs

  seed-via-vercel:
    name: "4 · Seed usuarios (API Vercel)"
    needs: vercel-redeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate seed secrets
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_CAMARERO_PASSWORD: ${{ secrets.SEED_CAMARERO_PASSWORD }}
        run: node scripts/ci/validate-secrets.mjs seed-via-vercel
      - name: Seed usuarios vía /api/setup/seed
        env:
          SETUP_BOOTSTRAP_TOKEN: ${{ secrets.SETUP_BOOTSTRAP_TOKEN }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_CAMARERO_PASSWORD: ${{ secrets.SEED_CAMARERO_PASSWORD }}
        run: node scripts/ci/seed-via-vercel.mjs
        continue-on-error: true

  verify-health:
    name: "5 · Verify print health"
    needs: seed-via-vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify health endpoint
        env:
          VERCEL_PRODUCTION_URL: https://comandero-taberneta.vercel.app
        run: node scripts/ci/verify-print-health.mjs

  verify-auth:
    name: "6 · Verify login ready"
    needs: [seed-via-vercel, supabase-seed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify auth status
        env:
          VERCEL_PRODUCTION_URL: https://comandero-taberneta.vercel.app
        run: node scripts/ci/verify-auth-status.mjs

  ensure-catalogo:
    name: "6b · Ensure catálogo"
    needs: vercel-redeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ensure catálogo platos
        env:
          VERCEL_PRODUCTION_URL: https://comandero-taberneta.vercel.app
        run: node scripts/ci/ensure-catalogo.mjs
        continue-on-error: true
