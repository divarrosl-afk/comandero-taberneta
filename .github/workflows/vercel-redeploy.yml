name: Vercel redeploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    name: Redeploy producción
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/validate-secrets.mjs vercel-redeploy

      - name: Redeploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_SLUG: divarro
        run: node scripts/ci/redeploy-vercel.mjs
