name: Supabase migrate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Bootstrap schema + migraciones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ci/validate-secrets.mjs migrate

      - name: Bootstrap Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/bootstrap-supabase-db.mjs
